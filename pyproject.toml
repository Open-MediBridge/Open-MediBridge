[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-medi"
version = "0.1.0"
description = "Voice-powered clinical decision support: faster-whisper transcription + RAG over a symptom-disease knowledge base + OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1.0",
    "fastembed>=0.3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# NVIDIA GPU runtime for faster-whisper (cuBLAS + cuDNN via pip wheels):
#   pip install -e .[cuda]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[tool.setuptools]
packages = ["open_medi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
